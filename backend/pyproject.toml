[project]
name = "wealth-intelligence-ai-backend"
version = "0.1.0"
description = "Wealth Intelligence AI — FastAPI backend: B2B API, AI engine, risk analytics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",   # JWT
    "python-multipart>=0.0.9",          # OAuth2 form
    # Password hashing uses the stdlib (hashlib PBKDF2) — no extra dependency.
]

[project.optional-dependencies]
# Real deployments add: sqlalchemy, psycopg, redis, langgraph, llama-index,
# opentelemetry-*, and provider SDKs. Kept out of the base install so the
# scaffold runs with an in-memory repository and deterministic stubs.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI relies on `Depends()`/`Header()` as default argument values.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
