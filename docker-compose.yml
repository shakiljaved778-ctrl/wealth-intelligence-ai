# Local dev orchestration. Production deploys to AWS (see infra/README.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wia
      POSTGRES_PASSWORD: wia
      POSTGRES_DB: wia
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      WIA_DATABASE_URL: postgresql+psycopg://wia:wia@db:5432/wia
      WIA_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/app"]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
    volumes: ["./frontend:/app", "/app/node_modules"]

volumes:
  pgdata:
